<div class="login-container min-vh-100 d-flex align-items-center justify-content-center" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <mat-card class="login-card">
          <mat-card-header class="text-center mb-4 d-flex justify-content-center">
            <div class="d-flex flex-column align-items-center">
              <mat-icon style="font-size: 48px; color: #667eea; width: 48px; height: 48px;" class="mb-3">library_music</mat-icon>
              <mat-card-title class="h3 mb-1">Welcome Back</mat-card-title>
              <mat-card-subtitle>Sign in to Chinook Music</mat-card-subtitle>
            </div>
          </mat-card-header>
          
          <mat-card-content>
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
              <!-- Email Field -->
              <mat-form-field appearance="outline" class="w-100 mb-3">
                <mat-label>Email</mat-label>
                <input matInput 
                       type="email" 
                       formControlName="email"
                       placeholder="Enter your email">
                <mat-icon matPrefix>email</mat-icon>
                <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
                  Email is required
                </mat-error>
                <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
                  Please enter a valid email
                </mat-error>
              </mat-form-field>

              <!-- Password Field -->
              <mat-form-field appearance="outline" class="w-100 mb-3">
                <mat-label>Password</mat-label>
                <input matInput 
                       [type]="hidePassword ? 'password' : 'text'" 
                       formControlName="password"
                       placeholder="Enter your password">
                <mat-icon matPrefix>lock</mat-icon>
                <button mat-icon-button 
                        matSuffix 
                        type="button"
                       
                  ></button>
              
                <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
                  Password is required
                </mat-error>
              </mat-form-field>


              <!-- Submit Button -->
              <button mat-raised-button 
                      color="primary" 
                      type="submit"
                      class="w-100 mb-3"
                      [disabled]="loginForm.invalid || loading">
                <mat-icon class="me-2">login</mat-icon>
                Sign In
              </button>

              <!-- Loading -->
              <div *ngIf="loading" class="text-center">
                <mat-spinner diameter="30"></mat-spinner>
              </div>
            </form>
          </mat-card-content>

          <mat-card-actions class="text-center">
            <p class="mb-0">
              Don't have an account? 
              <a href="#" class="text-decoration-none fw-bold">Sign up</a>
            </p>
          </mat-card-actions>
        </mat-card>

        <!-- Back to Home -->
        <div class="text-center mt-4">
          <button mat-stroked-button routerLink="/" class="text-white border-white">
            <mat-icon class="me-2">arrow_back</mat-icon>
            Back to Home
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
