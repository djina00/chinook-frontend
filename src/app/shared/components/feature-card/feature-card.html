<mat-card class="feature-card h-100">
  <mat-card-content class="text-center p-4">
    <div class="feature-icon mb-3">
      <mat-icon class="feature-mat-icon">{{ icon }}</mat-icon>
    </div>
    <mat-card-title class="fw-bold mb-3">{{ title }}</mat-card-title>
    <mat-card-subtitle class="text-muted">{{ description }}</mat-card-subtitle>
  </mat-card-content>
</mat-card>
