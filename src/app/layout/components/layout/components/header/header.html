<mat-toolbar color="primary" class="mat-elevation-2 fixed-top">
  <div class="container-fluid d-flex align-items-center">
    <!-- Brand -->
    <a routerLink="/" class="brand-title text-decoration-none text-success d-flex align-items-center">
      <mat-icon class="me-2">library_music</mat-icon>
      <strong>Chinook</strong>
    </a>
    
    <!-- Spacer for desktop navigation -->
    <span class="flex-grow-1 d-none d-md-block"></span>
    
    <!-- Desktop Navigation -->
    <div class="d-none d-md-flex align-items-center">
      <button mat-button routerLink="/" routerLinkActive="active-link">
        <mat-icon class="me-1">home</mat-icon>
        Home
      </button>
      <button mat-button routerLink="/home/albums" routerLinkActive="active-link">
        <mat-icon class="me-1">album</mat-icon>
        Albums
      </button>
      
      <span class="mx-3">|</span>
      
      <button mat-button>
        <mat-icon class="me-1">admin_panel_settings</mat-icon>
        Admin
      </button>
      <button mat-raised-button color="accent" class="ms-2" routerLink="/login">
        <mat-icon class="me-1">login</mat-icon>
        Login
      </button>
    </div>
    
    <!-- Mobile Menu Button -->
    <button mat-icon-button class="d-md-none ms-auto" (click)="toggleMobileMenu()">
      <mat-icon>menu</mat-icon>
    </button>
  </div>
</mat-toolbar>

<!-- Mobile Navigation Menu -->
<mat-nav-list *ngIf="isMobileMenuOpen" class="d-md-none mat-elevation-1">
  <a mat-list-item routerLink="/" (click)="toggleMobileMenu()">
    <mat-icon matListItemIcon>home</mat-icon>
    <span matListItemTitle>Home</span>
  </a>
  <a mat-list-item routerLink="/home/albums" (click)="toggleMobileMenu()">
    <mat-icon matListItemIcon>album</mat-icon>
    <span matListItemTitle>Albums</span>
  </a>
  <mat-divider></mat-divider>
  <a mat-list-item (click)="toggleMobileMenu()">
    <mat-icon matListItemIcon>admin_panel_settings</mat-icon>
    <span matListItemTitle>Admin</span>
  </a>
  <a mat-list-item routerLink="/login" (click)="toggleMobileMenu()">
    <mat-icon matListItemIcon>login</mat-icon>
    <span matListItemTitle>Login</span>
  </a>
</mat-nav-list>
