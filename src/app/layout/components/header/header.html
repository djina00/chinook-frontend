<mat-toolbar color="primary" class="mat-elevation-2 fixed-top">
  <div class="container-fluid d-flex align-items-center">
    <!-- Brand -->
    <a routerLink="/" class="brand-title text-decoration-none text-success d-flex align-items-center">
      <mat-icon class="me-2">library_music</mat-icon>
      <strong>Chinook</strong>
    </a>
    
    <!-- Spacer for desktop navigation -->
    <span class="flex-grow-1 d-none d-md-block"></span>
    
    <!-- Desktop Navigation -->
    <div class="d-none d-md-flex align-items-center">
      <!-- Home and Albums - visible to both admin and user when logged in -->
      <ng-container *ngIf="isLoggedIn && (isAdmin || isUser)">
        <button mat-button routerLink="/" routerLinkActive="active-link">
          <mat-icon class="me-1">home</mat-icon>
          Home
        </button>
        <button mat-button routerLink="/home/albums" routerLinkActive="active-link">
          <mat-icon class="me-1">album</mat-icon>
          Albums
        </button>
        <button mat-button routerLink="/home/cart">
          <mat-icon class="me-1" [matBadge]="cartCount" [matBadgeHidden]="cartCount === 0" matBadgeColor="accent" aria-hidden="false">shopping_cart</mat-icon>
          Cart
        </button>
      </ng-container>
      
      <!-- Admin section - only visible to admin -->
      <ng-container *ngIf="isLoggedIn && isAdmin">
        <span class="mx-3">|</span>
        <button mat-button routerLink="/admin">
          <mat-icon class="me-1">admin_panel_settings</mat-icon>
          Admin
        </button>
      </ng-container>
      
      <!-- Auth buttons -->
      <ng-container *ngIf="isLoggedIn">
        <span class="mx-3">|</span>
        <button mat-raised-button color="warn" class="ms-2" (click)="logout()">
          <mat-icon class="me-1">logout</mat-icon>
          Logout
        </button>
      </ng-container>
      
      <ng-container *ngIf="!isLoggedIn">
        <button mat-raised-button color="accent" class="ms-2" routerLink="/login">
          <mat-icon class="me-1">login</mat-icon>
          Login
        </button>
      </ng-container>
    </div>
    
    <!-- Mobile Menu Button -->
    <button mat-icon-button class="d-md-none ms-auto" (click)="toggleMobileMenu()">
      <mat-icon>menu</mat-icon>
    </button>
  </div>
</mat-toolbar>

<!-- Mobile Navigation Menu -->
<mat-nav-list *ngIf="isMobileMenuOpen" class="d-md-none mat-elevation-1">
  <!-- Home and Albums - visible to both admin and user when logged in -->
  <ng-container *ngIf="isLoggedIn && (isAdmin || isUser)">
    <a mat-list-item routerLink="/" (click)="toggleMobileMenu()">
      <mat-icon matListItemIcon>home</mat-icon>
      <span matListItemTitle>Home</span>
    </a>
    <a mat-list-item routerLink="/home/albums" (click)="toggleMobileMenu()">
      <mat-icon matListItemIcon>album</mat-icon>
      <span matListItemTitle>Albums</span>
    </a>
    <a mat-list-item routerLink="/home/cart" (click)="toggleMobileMenu()">
      <mat-icon matListItemIcon [matBadge]="cartCount" [matBadgeHidden]="cartCount === 0" matBadgeColor="accent" aria-hidden="false">shopping_cart</mat-icon>
      <span matListItemTitle>Cart</span>
    </a>
  </ng-container>
  
  <!-- Admin section - only visible to admin -->
  <ng-container *ngIf="isLoggedIn && isAdmin">
    <mat-divider></mat-divider>
    <a mat-list-item routerLink="/admin" (click)="toggleMobileMenu()">
      <mat-icon matListItemIcon>admin_panel_settings</mat-icon>
      <span matListItemTitle>Admin</span>
    </a>
  </ng-container>
  
  <!-- Auth options -->
  <ng-container *ngIf="isLoggedIn">
    <mat-divider></mat-divider>
    <a mat-list-item (click)="logout(); toggleMobileMenu()">
      <mat-icon matListItemIcon>logout</mat-icon>
      <span matListItemTitle>Logout</span>
    </a>
  </ng-container>
  
  <ng-container *ngIf="!isLoggedIn">
    <a mat-list-item routerLink="/login" (click)="toggleMobileMenu()">
      <mat-icon matListItemIcon>login</mat-icon>
      <span matListItemTitle>Login</span>
    </a>
  </ng-container>
</mat-nav-list>
