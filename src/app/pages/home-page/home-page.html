<div class="container-fluid">
  <mat-toolbar color="primary" class="mb-4">
    <mat-icon>library_music</mat-icon>
    <span class="ms-2">Chinook Music Tracks</span>
  </mat-toolbar>

  <!-- Loading State -->
  <div *ngIf="loading">
    <app-spinner message="Loading tracks..."></app-spinner>
  </div>

  <!-- Error State -->
  <mat-card *ngIf="error" class="mb-4">
    <mat-card-content>
      <div class="d-flex align-items-center">
        <mat-icon color="warn" class="me-2">error</mat-icon>
        <span>{{ error }}</span>
      </div>
    </mat-card-content>
  </mat-card>

  <!-- Tracks Display -->
  <div *ngIf="!loading && !error && tracks.length > 0">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="mb-0">Music Library</h2>
      <mat-chip-listbox>
        <mat-chip-option>{{ tracks.length }} tracks</mat-chip-option>
      </mat-chip-listbox>
    </div>
    
    <div class="row g-3">
      <div class="col-xl-3 col-lg-4 col-md-6 col-sm-12" *ngFor="let track of tracks">
        <app-track-card [track]="track"></app-track-card>
      </div>
    </div>
  </div>

  <!-- No Tracks State -->
  <mat-card *ngIf="!loading && !error && tracks.length === 0">
    <mat-card-content>
      <div class="text-center py-5">
        <mat-icon style="font-size: 48px; color: #6c757d;">library_music</mat-icon>
        <h3 class="mt-3 text-muted">No tracks found</h3>
        <p class="text-muted">There are no tracks available at the moment.</p>
      </div>
    </mat-card-content>
  </mat-card>
</div>
