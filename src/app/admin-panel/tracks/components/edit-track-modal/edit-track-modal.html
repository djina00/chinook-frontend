<div class="p-4">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0 d-flex align-items-center">
      <mat-icon class="me-2">edit</mat-icon>
      Edit Track
    </h4>
    <button mat-icon-button (click)="onCancel()" matTooltip="Close">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Edit Form -->
  <form [formGroup]="editForm" (ngSubmit)="onSave()">
    <div class="row g-3">
      <!-- Track Name -->
      <div class="col-12">
        <mat-card class="h-100">
          <mat-card-content class="p-3">
            <div class="d-flex align-items-center mb-2">
              <mat-icon class="me-2 text-primary">library_music</mat-icon>
              <h6 class="mb-0 text-muted">Track Name</h6>
            </div>
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Track Name</mat-label>
              <input matInput formControlName="Name" required>
              <mat-error *ngIf="editForm.get('Name')?.hasError('required')">
                Track name is required
              </mat-error>
              <mat-error *ngIf="editForm.get('Name')?.hasError('minlength')">
                Track name must be at least 1 character
              </mat-error>
            </mat-form-field>
          </mat-card-content>
        </mat-card>
      </div>

      <!-- Price -->
      <div class="col-md-12">
        <mat-card class="h-100">
          <mat-card-content class="p-3">
            <div class="d-flex align-items-center mb-2">
              <mat-icon class="me-2 text-success">attach_money</mat-icon>
              <h6 class="mb-0 text-muted">Price</h6>
            </div>
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Unit Price</mat-label>
              <input matInput type="number" step="0.01" formControlName="UnitPrice" required>
              <mat-error *ngIf="editForm.get('UnitPrice')?.hasError('required')">
                Price is required
              </mat-error>
              <mat-error *ngIf="editForm.get('UnitPrice')?.hasError('min')">
                Price must be 0 or greater
              </mat-error>
            </mat-form-field>
          </mat-card-content>
        </mat-card>
      </div>
    </div>

    <!-- Actions -->
    <div class="d-flex justify-content-end gap-2 mt-4">
      <button type="button" mat-stroked-button (click)="onCancel()">
        Cancel
      </button>
      <button type="submit" mat-raised-button color="primary" [disabled]="editForm.invalid">
        <mat-icon class="me-1">save</mat-icon>
        Save Changes
      </button>
    </div>
  </form>
</div>
