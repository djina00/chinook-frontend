<!-- Page Header -->
<mat-toolbar color="primary">
  <mat-icon class="me-2">people</mat-icon>
  <span>Users Management</span>
  <span class="spacer"></span>
  <mat-chip>{{ totalUsers }} users</mat-chip>
</mat-toolbar>

<!-- Loading Spinner -->
<div *ngIf="loading" class="d-flex justify-content-center align-items-center" style="min-height: 400px;">
  <app-spinner></app-spinner>
</div>

<!-- Users Table -->
<div *ngIf="!loading" class="p-3">

  <!-- Table Card -->
  <mat-card>
    <div class="table-responsive">
      <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z0 w-100">
        
        <!-- User ID Column -->
        <ng-container matColumnDef="CustomerId">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
          <td mat-cell *matCellDef="let user">{{ user.CustomerId }}</td>
        </ng-container>

        <!-- First Name Column -->
        <ng-container matColumnDef="FirstName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>First Name</th>
          <td mat-cell *matCellDef="let user">
            <div class="fw-bold">{{ user.FirstName }}</div>
          </td>
        </ng-container>

        <!-- Last Name Column -->
        <ng-container matColumnDef="LastName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Last Name</th>
          <td mat-cell *matCellDef="let user">
            <div class="fw-bold">{{ user.LastName }}</div>
          </td>
        </ng-container>

        <!-- Email Column -->
        <ng-container matColumnDef="Email">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
          <td mat-cell *matCellDef="let user">
            <div class="text-primary">{{ user.Email }}</div>
          </td>
        </ng-container>

        <!-- Company Column -->
        <ng-container matColumnDef="Company">
          <th mat-header-cell *matHeaderCellDef>Company</th>
          <td mat-cell *matCellDef="let user">
            <div *ngIf="user.Company; else noCompany">
              <div class="fw-medium">{{ user.Company }}</div>
            </div>
            <ng-template #noCompany>
              <span class="text-muted">—</span>
            </ng-template>
          </td>
        </ng-container>

        <!-- Country Column -->
        <ng-container matColumnDef="Country">
          <th mat-header-cell *matHeaderCellDef>Country</th>
          <td mat-cell *matCellDef="let user">
            <div *ngIf="user.Country; else noCountry">
              <span class="badge bg-light text-dark">{{ user.Country }}</span>
            </div>
            <ng-template #noCountry>
              <span class="text-muted">—</span>
            </ng-template>
          </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="text-center">Actions</th>
          <td mat-cell *matCellDef="let user" class="text-center">
            <div class="d-flex gap-1 justify-content-center">
              <button mat-mini-fab color="accent" matTooltip="Edit User" class="me-1" (click)="editUser(user)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-mini-fab color="warn" matTooltip="Delete User" (click)="deleteUser(user)">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>

    <!-- Pagination -->
    <mat-paginator 
      [pageSize]="pageSize"
      [pageIndex]="currentPage"
      [length]="totalUsers"
      [pageSizeOptions]="[5, 10, 25, 50]"
      (page)="onPageChange($event)"
      showFirstLastButtons>
    </mat-paginator>
  </mat-card>
</div>
