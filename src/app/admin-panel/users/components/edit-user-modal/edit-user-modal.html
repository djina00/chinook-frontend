<div class="p-4">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0 d-flex align-items-center">
      <mat-icon class="me-2">edit</mat-icon>
      Edit User Role
    </h4>
    <button mat-icon-button (click)="onCancel()" matTooltip="Close">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- User Info -->
  <div class="mb-3">
    <mat-card>
      <mat-card-content class="p-3">
        <div class="d-flex align-items-center mb-2">
          <mat-icon class="me-2 text-info">person</mat-icon>
          <h6 class="mb-0 text-muted">User Information</h6>
        </div>
        <p class="mb-1"><strong>Name:</strong> {{ user.FirstName }} {{ user.LastName }}</p>
        <p class="mb-0"><strong>Email:</strong> {{ user.Email }}</p>
      </mat-card-content>
    </mat-card>
  </div>

  <!-- Edit Form -->
  <form [formGroup]="editForm" (ngSubmit)="onSave()">
    <div class="row g-3">
      <!-- Role -->
      <div class="col-12">
        <mat-card class="h-100">
          <mat-card-content class="p-3">
            <div class="d-flex align-items-center mb-2">
              <mat-icon class="me-2 text-primary">admin_panel_settings</mat-icon>
              <h6 class="mb-0 text-muted">User Role</h6>
            </div>
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>User Role</mat-label>
              <mat-select formControlName="RoleId" required>
                <mat-option [value]="1">Admin</mat-option>
                <mat-option [value]="2">User</mat-option>
              </mat-select>
              <mat-error *ngIf="editForm.get('RoleId')?.hasError('required')">
                Role is required
              </mat-error>
            </mat-form-field>
          </mat-card-content>
        </mat-card>
      </div>
    </div>

    <!-- Actions -->
    <div class="d-flex justify-content-end gap-2 mt-4">
      <button type="button" mat-stroked-button (click)="onCancel()">
        Cancel
      </button>
      <button type="submit" mat-raised-button color="primary" [disabled]="editForm.invalid">
        <mat-icon class="me-1">save</mat-icon>
        Update Role
      </button>
    </div>
  </form>
</div>
