<mat-card class="h-100 shadow-sm border-0 hover-card">
  <mat-card-content class="text-center p-4">
    <mat-icon class="stats-icon mb-3" [class]="colorClass">{{ icon }}</mat-icon>
    <h3 class="display-6 fw-bold mb-2">{{ value }}</h3>
    <p class="text-muted mb-0">{{ label }}</p>
  </mat-card-content>
</mat-card>
